<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbf5f3">
  <meta name="description" content="把每一次心动，藏进照片里。一个属于我们的浪漫相册。">
  <title>心动相册 · Our little forever</title>
  <link rel="stylesheet" href="styles.css">
  <script src="photos.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3l1 3M4 12l1 3a8 8 0 0 0 13 3"/></symbol>
  </defs></svg>

  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="心动相册首页"><span class="brand-mark"><svg><use href="#icon-heart"/></svg></span><span>心动相册<small>OUR LITTLE FOREVER</small></span></a>
    <span class="header-note"><span></span> 只关于你和我</span>
  </header>

  <main>
    <section class="hero" id="home" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow"><span></span> EVERY PICTURE, A LITTLE LOVE</p>
        <h1 id="hero-title">把每一次心动，<br>藏进<span class="rose-text">照片里。</span></h1>
        <p class="hero-description">有些瞬间，想和你重温很多遍。<br>让零碎的日常，拼成一颗只为你跳动的心。</p>
        <button class="primary-button" id="shuffle-heart" type="button">换一批心动 <svg><use href="#icon-refresh"/></svg></button>
        <div class="hero-footnote"><span class="mini-heart">♡</span><span>每一次心跳，都是新的心动</span><span class="fine-line"></span></div>
      </div>
      <div class="heart-scene">
        <div class="orbit orbit-one" aria-hidden="true"></div><div class="orbit orbit-two" aria-hidden="true"></div>
        <span class="scene-spark spark-one" aria-hidden="true">✧</span><span class="scene-spark spark-two" aria-hidden="true">✧</span>
        <span class="handwriting" aria-hidden="true">you & me, always.</span>
        <div class="heart-glow" aria-hidden="true"></div>
        <div class="photo-heart" id="photo-heart" aria-label="由照片组成的跳动爱心，点击任意照片放大"></div>
        <div class="heart-caption"><span class="live-dot"></span><span>点击照片，放大这一刻</span></div>
      </div>
    </section>

    <div class="moment-bar">
      <div class="moment-count"><svg><use href="#icon-heart"/></svg><span><strong class="photo-count">99</strong> 个瞬间，同一份喜欢</span></div>
      <p>Our story, in every frame.</p>
      <div class="heart-controls"><button id="toggle-heart" type="button" aria-pressed="false"><span id="pause-icon" aria-hidden="true">Ⅱ</span><span id="pause-label">暂停心跳</span></button></div>
    </div>

  </main>

  <dialog id="lightbox" aria-label="照片放大查看">
    <div class="lightbox-toolbar"><span id="viewer-counter"></span><button class="viewer-button" id="close-viewer" aria-label="关闭照片"><svg><use href="#icon-close"/></svg></button></div>
    <button class="viewer-button viewer-prev" id="prev-photo" aria-label="上一张照片"><svg><use href="#icon-arrow"/></svg></button>
    <figure><img id="viewer-image" alt=""><figcaption id="viewer-caption"></figcaption></figure>
    <button class="viewer-button viewer-next" id="next-photo" aria-label="下一张照片"><svg><use href="#icon-arrow"/></svg></button>
    <div class="viewer-hint">← → 切换照片 <span>·</span> ESC 关闭 <span>·</span> 手机上可左右滑动</div>
  </dialog>
</body>
</html>
